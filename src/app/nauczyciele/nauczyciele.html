<form #loginForm="ngForm" (ngSubmit)="loginFormSubmit(loginForm)">
    <input type="text" name="login" placeholder="login" ngModel>
    <input type="password" name="pass" ngModel>
    <button type="submit">Logowanie</button>
</form>
